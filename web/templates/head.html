<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="generator" content="{{ lambdapad.name }} {{ lambdapad.vsn }}">
  {% if post %}
  <title>{{ post.title }} — Prisma Blog</title>
  <meta name="title" content="{{ post.title }} — Prisma Blog">
  <meta name="description" content="{% if post.summary %}{{ post.summary }}{% else %}{{ post.excerpt }}{% endif %}">
  <meta name="keywords" content="{{ post.tags }}">
  <meta name="author" content="{{ post.author }}">
  <link rel="canonical" href="https://prisma.altenwald.com/blog/{{ post.id }}/">
  {% else %}
  <title>{{ blog.title }}</title>
  <meta name="title" content="{{ blog.title }}">
  <meta name="description" content="{{ blog.description }}">
  <meta name="keywords" content="erlang, elixir, dialyzer, gradualizer, beam, static type analyzer, typespecs, pplt, altenwald, static analysis">
  <meta name="author" content="Altenwald">
  <link rel="canonical" href="https://prisma.altenwald.com/">
  {% endif %}
  <meta name="robots" content="index, follow">
  <meta name="distribution" content="global">
  <link rel="sitemap" type="application/xml" title="Sitemap" href="https://prisma.altenwald.com/sitemap.xml">

  <!-- Mobile & PWA Theme -->
  <meta name="theme-color" content="#0f172a">
  <meta name="msapplication-TileColor" content="#0f172a">
  <meta name="apple-mobile-web-app-title" content="Prisma">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- Favicons -->
  <link rel="icon" type="image/svg+xml" href="/assets/prisma.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/prisma.png">
  <link rel="apple-touch-icon" href="/assets/prisma.png">

  <!-- Schema.org Microdata -->
  <meta itemprop="name" content="{% if post %}{{ post.title }} — Prisma{% else %}{{ blog.title }}{% endif %}">
  <meta itemprop="description" content="{% if post %}{% if post.summary %}{{ post.summary }}{% else %}{{ post.excerpt }}{% endif %}{% else %}{{ blog.description }}{% endif %}">
  <meta itemprop="image" content="{% if post %}https://prisma.altenwald.com/assets/og/{{ post.id }}.png{% else %}https://prisma.altenwald.com/assets/prisma_og.png{% endif %}">

  <!-- Open Graph / Facebook / LinkedIn / Telegram -->
  <meta property="og:type" content="{% if post %}article{% else %}website{% endif %}">
  <meta property="og:site_name" content="Prisma · Altenwald">
  <meta property="og:url" content="{% if post %}https://prisma.altenwald.com/blog/{{ post.id }}/{% else %}https://prisma.altenwald.com/{% endif %}">
  <meta property="og:title" content="{% if post %}{{ post.title }} — Prisma{% else %}{{ blog.title }}{% endif %}">
  <meta property="og:description" content="{% if post %}{% if post.summary %}{{ post.summary }}{% else %}{{ post.excerpt }}{% endif %}{% else %}{{ blog.description }}{% endif %}">
  <meta property="og:image" content="{% if post %}https://prisma.altenwald.com/assets/og/{{ post.id }}.png{% else %}https://prisma.altenwald.com/assets/prisma_og.png{% endif %}">
  <meta property="og:image:secure_url" content="{% if post %}https://prisma.altenwald.com/assets/og/{{ post.id }}.png{% else %}https://prisma.altenwald.com/assets/prisma_og.png{% endif %}">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="{% if post %}{{ post.title }}{% else %}{{ blog.title }}{% endif %}">
  <meta property="og:locale" content="en_US">

  <!-- Twitter / X Card / Telegram -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:site" content="@altenwald">
  <meta name="twitter:creator" content="@altenwald">
  <meta name="twitter:url" content="{% if post %}https://prisma.altenwald.com/blog/{{ post.id }}/{% else %}https://prisma.altenwald.com/{% endif %}">
  <meta name="twitter:title" content="{% if post %}{{ post.title }} — Prisma{% else %}{{ blog.title }}{% endif %}">
  <meta name="twitter:description" content="{% if post %}{% if post.summary %}{{ post.summary }}{% else %}{{ post.excerpt }}{% endif %}{% else %}{{ blog.description }}{% endif %}">
  <meta name="twitter:image" content="{% if post %}https://prisma.altenwald.com/assets/x/{{ post.id }}.png{% else %}https://prisma.altenwald.com/assets/prisma_og.png{% endif %}">
  <meta name="twitter:image:alt" content="{% if post %}{{ post.title }}{% else %}{{ blog.title }}{% endif %}">

  <!-- JSON-LD Structured Data for Search Engines -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "Prisma",
    "applicationCategory": "DeveloperApplication",
    "operatingSystem": "Cross-platform (BEAM, Erlang/OTP, Elixir)",
    "url": "https://prisma.altenwald.com/",
    "image": "https://prisma.altenwald.com/assets/prisma_og.png",
    "description": "Fast, modular static type and spec analyzer with .pplt tables for Erlang and Elixir. Up to 6.3x faster than Dialyzer with 20.8x less CPU.",
    "softwareVersion": "0.1.0",
    "license": "https://github.com/altenwald/prisma/blob/main/LICENSE",
    "codeRepository": "https://github.com/altenwald/prisma",
    "author": {
      "@type": "Organization",
      "name": "Altenwald",
      "url": "https://altenwald.com/"
    },
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "USD"
    }
  }
  </script>

  <!-- Tailwind CSS & DaisyUI via CDN -->
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet" type="text/css" />
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Highlight.js Theme for Code Blocks -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.10.0/build/styles/github-dark.min.css">

  <!-- D3.js for interactive benchmark charts -->
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>

  <script>
    tailwind.config = {
      darkMode: ['class', '[data-theme="dark"]'],
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            prisma: {
              navy: '#1b3566',
              blue: '#2563eb',
              azure: '#0284c7',
              sky: '#38bdf8',
              teal: '#0d9488',
              amber: '#d97706',
              purple: '#7c3aed',
              dark: '#0f172a',
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #fafaf9;
      color: #0f172a;
    }
    code, pre { font-family: 'JetBrains Mono', monospace; }
    
    .floating-pill {
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(226, 232, 240, 0.85);
      box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.05);
    }

    .clean-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 1.5rem;
      box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.02), 0 1px 2px -1px rgba(0, 0, 0, 0.02);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .clean-card:hover {
      box-shadow: 0 12px 24px -4px rgba(15, 23, 42, 0.06);
      transform: translateY(-2px);
    }

    .d3-tooltip {
      position: absolute;
      text-align: center;
      padding: 6px 12px;
      font-size: 12px;
      font-family: 'JetBrains Mono', monospace;
      background: #0f172a;
      color: #ffffff;
      border-radius: 8px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s ease;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      z-index: 50;
    }

    /* Markdown Blog Article Typography */
    .article-prose h2 {
      font-size: 1.65rem;
      font-weight: 800;
      color: #0f172a;
      margin-top: 2.5rem;
      margin-bottom: 1rem;
      letter-spacing: -0.02em;
    }
    .article-prose h3 {
      font-size: 1.25rem;
      font-weight: 700;
      color: #1e293b;
      margin-top: 2rem;
      margin-bottom: 0.75rem;
    }
    .article-prose p {
      color: #334155;
      line-height: 1.75;
      margin-bottom: 1.15rem;
      font-size: 1rem;
    }
    .article-prose ul, .article-prose ol {
      color: #334155;
      margin-bottom: 1.25rem;
      padding-left: 1.5rem;
      line-height: 1.75;
    }
    .article-prose ul { list-style-type: disc; }
    .article-prose ol { list-style-type: decimal; }
    .article-prose li { margin-bottom: 0.4rem; }
    .article-prose a {
      color: #2563eb;
      font-weight: 600;
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    .article-prose a:hover { color: #1d4ed8; }
    .article-prose hr {
      border-color: #e2e8f0;
      margin: 2.5rem 0;
    }
    .article-prose pre {
      background-color: #0f172a;
      color: #e2e8f0;
      padding: 1.1rem 1.25rem;
      border-radius: 1rem;
      overflow-x: auto;
      font-size: 0.82rem;
      line-height: 1.6;
      margin: 1.25rem 0;
      border: 1px solid #1e293b;
    }
    .article-prose pre code.hljs {
      background: transparent;
      padding: 0;
    }
    .article-prose :not(pre) > code {
      background-color: #f1f5f9;
      color: #0f172a;
      padding: 0.15rem 0.4rem;
      border-radius: 0.375rem;
      font-size: 0.85em;
      font-weight: 500;
      border: 1px solid #e2e8f0;
    }
    .article-prose table {
      width: 100%;
      border-collapse: collapse;
      margin: 1.5rem 0;
      font-size: 0.85rem;
      background: #ffffff;
      border-radius: 1rem;
      overflow: hidden;
      border: 1px solid #e2e8f0;
    }
    .article-prose thead tr {
      background-color: #f8fafc;
      border-bottom: 1px solid #e2e8f0;
      color: #475569;
      text-transform: uppercase;
      font-size: 0.72rem;
      letter-spacing: 0.05em;
    }
    .article-prose th, .article-prose td {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid #f1f5f9;
    }
    .article-prose tbody tr:hover {
      background-color: #f8fafc;
    }
    .mermaid-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 1.25rem;
      padding: 1.75rem 2.25rem 2.5rem;
      margin: 1.75rem 0;
      width: 100%;
      overflow-x: auto;
      overflow-y: visible;
    }
    .mermaid-card .mermaid {
      width: 100%;
      display: flex;
      justify-content: center;
      background: transparent;
      border: 0;
      padding: 0;
      margin: 0;
      overflow: visible;
    }
    .mermaid-card svg {
      width: 100% !important;
      max-width: 780px !important;
      height: auto !important;
      overflow: visible !important;
    }
  </style>
</head>
