name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; one that is running is not cancelled
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # The page carries its own copy of the logo and the demo (it is published as it is): they must be the ones in assets/
      - name: Web assets are in sync
        run: tools/check_web_assets.sh

      - name: Set up Erlang & Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: '27.3'
          elixir-version: '1.17.3'

      - name: Install Lambdapad (lpad)
        run: |
          mix local.hex --force
          mix local.rebar --force
          MIX_ENV=prod mix escript.install github lambdapad/lambdapad --force

      - name: Generate dynamic OG & X cards and compile site with Lambdapad
        working-directory: web
        run: |
          elixir og_cards.exs
          ~/.mix/escripts/lpad

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/site

      - id: deployment
        uses: actions/deploy-pages@v4
